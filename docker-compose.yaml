services:
  motocodex:
    build:
      context: .
      dockerfile: Dockerfile
    image: motocodex:latest
    container_name: motocodex
    restart: unless-stopped
    expose:
      - "9001"
    environment:
      NODE_ENV: production
      PORT: "9001"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: "file:/app/prisma/dev.db"
      SITE_URL: "https://motocodex.net"
    networks:
      - motocodex-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: motocodex-cloudflared
    restart: unless-stopped
    # Token comes from CLOUDFLARE_TUNNEL_TOKEN in the gitignored root .env file.
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - motocodex
    networks:
      - motocodex-net

networks:
  motocodex-net:
    driver: bridge
