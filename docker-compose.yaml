services:
  motocodex:
    build:
      context: .
      dockerfile: Dockerfile
    image: motocodex:latest
    container_name: motocodex
    restart: unless-stopped
    expose:
      - "9001"
    environment:
      NODE_ENV: production
      PORT: "9001"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: "file:/app/prisma/dev.db"
      SITE_URL: "https://motocodex.net"
    networks:
      - motocodex-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: motocodex-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token eyJhIjoiZjYzZmFmYzgyMjgwYmJhNDg5ZGZiZGI2NTFmMGFmMDUiLCJ0IjoiOGMzZTQ4MGMtN2FiYy00MzIzLThkMzYtMDk1MzM0MjlkMzI5IiwicyI6Ik1UY3lORE0zT1dJdE0ySmtNaTAwTkRGa0xUa3daRGN0TTJGaVltTTFOV0l6TTJGbSJ9
    depends_on:
      - motocodex
    networks:
      - motocodex-net

networks:
  motocodex-net:
    driver: bridge
